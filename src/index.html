<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mac Capture Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Tools">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <h1>Mac Capture Studio</h1>
            <p id="modeLabel">Ready</p>
          </div>
        </div>

        <button class="primary-action" id="captureBtn" title="Capture screen, window, or tab">
          <span>Capture</span>
        </button>

        <div class="tool-grid" id="toolGrid" aria-label="Markup tools">
          <button data-tool="select" class="active" title="Select">⌖</button>
          <button data-tool="pen" title="Pen">✎</button>
          <button data-tool="highlight" title="Highlighter">▰</button>
          <button data-tool="arrow" title="Arrow">↗</button>
          <button data-tool="line" title="Line">╱</button>
          <button data-tool="rect" title="Rectangle">▭</button>
          <button data-tool="ellipse" title="Ellipse">◯</button>
          <button data-tool="text" title="Text">T</button>
          <button data-tool="pixelate" title="Pixelate">▦</button>
          <button data-tool="crop" title="Crop">⌗</button>
        </div>

        <section class="controls" aria-label="Style controls">
          <label>
            Color
            <input id="colorInput" type="color" value="#e84545" />
          </label>
          <label>
            Width
            <input id="widthInput" type="range" min="2" max="24" value="5" />
          </label>
          <label>
            Font
            <input id="fontInput" type="range" min="16" max="72" value="28" />
          </label>
        </section>

        <section class="history-actions" aria-label="History actions">
          <button id="undoBtn" title="Undo">↶</button>
          <button id="redoBtn" title="Redo">↷</button>
          <button id="clearBtn" title="Clear markup">Clear</button>
          <button id="resetBtn" title="Reset image">Reset</button>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="status-pill" id="statusText">No capture loaded</div>
          <div class="top-actions">
            <button id="copyBtn" title="Copy PNG">Copy</button>
            <button id="exportBtn" title="Export PNG">Export</button>
            <button id="recordBtn" title="Start screen recording">Record</button>
            <button id="stopRecordBtn" title="Stop screen recording" disabled>Stop</button>
            <button id="saveProjectBtn" title="Save project">Save Project</button>
            <label class="file-button" title="Load project">
              Load
              <input id="loadProjectInput" type="file" accept="application/json" />
            </label>
            <button id="settingsBtn" title="Hotkey settings">Hotkeys</button>
          </div>
        </header>

        <section class="canvas-wrap" id="canvasWrap">
          <canvas id="editorCanvas" width="1200" height="760"></canvas>
          <div class="empty-state" id="emptyState">
            <h2>Capture something to begin</h2>
            <p>Choose a screen, app window, or browser tab, then mark it up and export it.</p>
          </div>
        </section>
      </main>
    </div>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-panel">
        <header>
          <h2>Hotkeys</h2>
          <button value="close" title="Close">×</button>
        </header>
        <label>
          Capture
          <input id="captureHotkey" data-shortcut="capture" placeholder="CommandOrControl+Shift+5" />
        </label>
        <label>
          Export
          <input id="exportHotkey" data-shortcut="export" placeholder="CommandOrControl+Shift+E" />
        </label>
        <label>
          Open editor
          <input id="openHotkey" data-shortcut="open" placeholder="CommandOrControl+Shift+O" />
        </label>
        <p>Use Electron accelerator names like CommandOrControl+Shift+5. In a browser, shortcuts apply only while this page is focused.</p>
        <menu>
          <button id="saveHotkeysBtn" value="default">Save</button>
        </menu>
      </form>
    </dialog>

    <script src="./renderer.js"></script>
  </body>
</html>
